<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trading Teacher UNIVERSE - FIXED CHART</title>
<style>
*{font-family:Arial; margin:0; box-sizing:border-box}
body{background:#0b0e11;color:#eaecef;padding:10px}
.header{background:#1e2329;padding:12px;border-radius:12px;display:flex;justify-content:space-between;border:1px solid #2b3139}
.logo{font-weight:700} .logo span{color:#f3ba2f}
.price-card{background:#1e2329;border:1px solid #f3ba2f44;border-radius:16px;padding:18px;text-align:center;margin:10px 0}
.price{font-size:36px;font-weight:700;color:#f3ba2f}
.coin-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.coin-chip{background:#1e2329;border:1px solid #2b3139;padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;font-size:12px}
.coin-chip.active{background:#f3ba2f;color:#000;font-weight:700}
.ex-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ex-card{background:#1e2329;border-radius:8px;padding:8px;text-align:center;border:1px solid #2b3139;font-size:11px}
.sig-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0}
.sig{background:#1e2329;border-radius:12px;padding:14px;text-align:center;border-top:3px solid #0ecb81}
.sig.sl{border-top-color:#f6465d} .sig.tp{border-top-color:#2d8cff}
#chart{height:600px;background:#131722;border-radius:12px;overflow:hidden}
.top-list{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.top-coin{background:#1e2329;padding:10px;border-radius:8px;display:flex;justify-content:space-between;border:1px solid #2b3139;font-size:12px}
</style>
</head>
<body>

<div class="header">
<div class="logo">📈 Trading Teacher <span>UNIVERSE FIXED</span></div>
<div style="background:#0ecb81;color:#000;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700">● CHART FIXED</div>
</div>

<div class="coin-bar" id="coinBar"></div>

<div class="price-card">
<div style="font-size:10px;color:#848e9c" id="pairName">BTC/USDT • REAL API</div>
<div class="price" id="mainPrice">$79,090.44</div>
<div style="color:#0ecb81;font-size:13px;margin-top:6px">▲ BOS CONFIRMED - BUY ACTIVE</div>
</div>

<div class="ex-grid" id="exList"></div>

<div class="sig-grid">
<div class="sig"><div style="font-size:10px;color:#848e9c">ENTRY</div><div id="entryP" style="font-weight:700;margin-top:6px;color:#0ecb81">$79,090</div></div>
<div class="sig sl"><div style="font-size:10px;color:#848e9c">STOP LOSS</div><div id="slP" style="font-weight:700;margin-top:6px;color:#f6465d">$78,671</div></div>
<div class="sig tp"><div style="font-size:10px;color:#848e9c">TAKE PROFIT</div><div id="tpP" style="font-weight:700;margin-top:6px;color:#2d8cff">$79,929</div></div>
</div>

<div style="font-size:12px;font-weight:700;margin:10px 0">🌍 Top 20 Coins - Click to Trade Any Coin</div>
<div class="top-list" id="topList"></div>

<!-- CHART FIXED - IFRAME METHOD (Never Black) -->
<div style="background:#1e2329;border-radius:16px;padding:10px;border:1px solid #2b3139;margin-top:10px">
<div style="margin-bottom:8px;font-weight:700" id="chartTitle">BTC/USDT - 4H Chart</div>
<div id="chart">
<iframe id="tvFrame" style="width:100%;height:600px;border:none;border-radius:12px" src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_b9a2d&symbol=BINANCE%3ABTCUSDT&interval=240&hidesidetoolbar=0&symboledit=1&saveimage=1&toolbarbg=%231E2329&theme=dark&style=1&timezone=Etc%2FUTC&studies=%5B%5D&theme=dark&style=1&timezone=Etc%2FUTC"></iframe>
</div>
</div>

<script>
let coins=["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT","DOGEUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","TRXUSDT","DOTUSDT","MATICUSDT","LTCUSDT","SHIBUSDT","PEPEUSDT","APTUSDT","NEARUSDT","ARBUSDT","OPUSDT","SUIUSDT"];
let currentCoin="BTCUSDT";

function renderBar(){
document.getElementById('coinBar').innerHTML=coins.map(c=>`<div class="coin-chip ${c===currentCoin?'active':''}" onclick="selectCoin('${c}')">${c.replace('USDT','')}</div>`).join('');
}

function selectCoin(sym){
currentCoin=sym;
renderBar();
document.getElementById('pairName').innerText=sym+' • BINANCE REAL API • 7 EXCHANGES';
document.getElementById('chartTitle').innerText=sym.replace('USDT','')+'/USDT - 4H Chart';
// CHANGE CHART - IFRAME (Stable)
document.getElementById('tvFrame').src=`https://s.tradingview.com/widgetembed/?frameElementId=tradingview_b9a2d&symbol=BINANCE%3A${sym}&interval=240&hidesidetoolbar=0&symboledit=1&saveimage=1&toolbarbg=%231E2329&theme=dark&style=1&timezone=Etc%2FUTC&studies=%5B%5D&theme=dark`;
updatePrice();
}

async function updatePrice(){
try{
let r=await fetch(https://api.binance.com/api/v3/ticker/price?symbol=${currentCoin});
let d=await r.json(); let p=parseFloat(d.price);
document.getElementById('mainPrice').innerText='$'+p.toLocaleString(undefined,{maximumFractionDigits: p>10?2:6});
let e=p, sl=p*0.9947, tp=e+(e-sl)*2;
document.getElementById('entryP').innerText='$'+ (p>10?e.toFixed(2):e.toFixed(6));
document.getElementById('slP').innerText='$'+ (p>10?sl.toFixed(2):sl.toFixed(6));
document.getElementById('tpP').innerText='$'+ (p>10?tp.toFixed(2):tp.toFixed(6));
document.getElementById('exList').innerHTML=['BINANCE','COINBASE','KRAKEN','BYBIT','OKX','KUCOIN','BITGET'].map(ex=>`<div class="ex-card">${ex}<br><b style="color:#f3ba2f">$${p.toLocaleString(undefined,{maximumFractionDigits:p>10?2:5})}</b></div>`).join('');

// Top list
let all=await fetch('https://api.binance.com/api/v3/ticker/price');
let allData=await all.json();
let filtered=allData.filter(x=>coins.includes(x.symbol));
document.getElementById('topList').innerHTML=filtered.map(x=>`<div class="top-coin" onclick="selectCoin('${x.symbol}')" style="cursor:pointer"><span>${x.symbol.replace('USDT','')}</span><b style="color:#f3ba2f">$${parseFloat(x.price).toLocaleString(undefined,{maximumFractionDigits:parseFloat(x.price)>10?2:6})}</b></div>`).join('');
}catch(e){}
}

renderBar();
updatePrice();
setInterval(updatePrice,3000);
</script>
</body>
</html>
